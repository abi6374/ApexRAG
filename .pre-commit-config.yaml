# ── Pre-commit hooks for ApexRAG ──────────────────────────────────────────
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version sync with pyproject.toml
    rev: v0.4.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --python-version=3.10]
        additional_dependencies:
          - pydantic
          - sqlalchemy
          - types-requests
        exclude: ^(tests/|examples/)

  - repo: https://github.com/python-poetry/poetry
    rev: 1.8.3
    hooks:
      - id: poetry-check
        name: pyproject.toml validation
        language: system
        entry: python -c "import tomllib; tomllib.load(open('pyproject.toml','rb'))"
        pass_filenames: false
        always_run: true
