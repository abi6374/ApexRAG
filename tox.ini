[tox]
envlist = py310, py311, py312
min_version = 4.0
skip_missing_interpreters = true

[testenv]
description = Run tests with pytest
deps =
    pytest>=8.2.0
    pytest-asyncio>=0.23.0
    pytest-cov>=5.0.0
commands =
    pytest tests/ -v --tb=short --cov=apex_rag --cov-report=term-missing

[testenv:lint]
description = Run linters and type checker
deps =
    ruff>=0.4.0
    mypy>=1.10.0
commands =
    ruff check apex_rag/
    ruff format --check apex_rag/
    mypy apex_rag/ --ignore-missing-imports --python-version=3.10

[testenv:build]
description = Verify package builds cleanly
deps =
    build>=1.0.0
commands =
    python -m build
