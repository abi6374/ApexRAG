[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apex-rag"
version = "0.1.8"
description = "A production-grade, local-first Agentic RAG library using structural document navigation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "G S Abinivas" }
]
keywords = ["rag", "llm", "ollama", "agentic", "retrieval", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Document parsing
    "markitdown[all]>=0.0.1a2",
    # ORM & Storage
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Ollama client
    "ollama>=0.2.0",
    # Async HTTP
    "httpx>=0.27.0",
    # FastAPI integration support
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # Utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]
postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
]
docling = [
    "docling>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/your-org/apex-rag"
Repository = "https://github.com/your-org/apex-rag"
Issues = "https://github.com/your-org/apex-rag/issues"

[tool.hatch.build.targets.wheel]
packages = ["apex_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apex_rag"]
omit = ["tests/*", "examples/*"]
