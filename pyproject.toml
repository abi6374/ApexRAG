[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apex-rag"
version = "0.1.8"
description = "A production-grade, local-first Agentic RAG library using structural document navigation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "G S Abinivas" }
]
keywords = ["rag", "llm", "ollama", "agentic", "retrieval", "nlp", "document-search", "local-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

# ── Core Dependencies ─────────────────────────────────────────────────────
# These are installed with every `pip install apex-rag`.
# We keep it lean — only what the library needs at runtime.
dependencies = [
    # Document parsing (lightweight — without heavy extras)
    "markitdown>=0.0.1a2",
    # ORM & Storage
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # Ollama client
    "ollama>=0.2.0",
    # Utilities
    "rich>=13.7.0",
]

# ── Optional Extras ───────────────────────────────────────────────────────
# Install with:  pip install apex-rag[web,postgres,docling]
[project.optional-dependencies]
# Web dashboard & REST API (FastAPI)
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]
# PostgreSQL support
postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
]
# Advanced PDF parsing (IBM Docling)
docling = [
    "docling>=1.16.0",
]
# Database migrations
migrations = [
    "alembic>=1.13.0",
]
# Vector embeddings (sentence-transformers)
vectors = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
]
# OpenTelemetry instrumentation
telemetry = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]
# Monitoring stack (Prometheus + Grafana)
monitoring = [
    "prometheus-client>=0.20.0",
]
# MkDocs documentation
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]
# Development & testing
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "tox>=4.0.0",
    "httpx>=0.27.0",
]
# Everything
all = [
    "apex-rag[web,postgres,docling,migrations,vectors,telemetry,monitoring,docs,dev]",
]

[[tool.tox.env]]
name = "py310"
base_python = "3.10"
deps = [".[dev]"]
commands = ["pytest tests/"]

[[tool.tox.env]]
name = "py311"
base_python = "3.11"
deps = [".[dev]"]
commands = ["pytest tests/"]

[[tool.tox.env]]
name = "py312"
base_python = "3.12"
deps = [".[dev]"]
commands = ["pytest tests/"]

[[tool.tox.env]]
name = "lint"
deps = ["ruff", "mypy"]
commands = [
    "ruff check apex_rag/",
    "ruff format --check apex_rag/",
    "mypy apex_rag/ --ignore-missing-imports --python-version=3.10",
]

[[tool.tox.env]]
name = "docs"
deps = [".[docs]"]
commands = ["mkdocs build --strict"]

[project.urls]
Homepage = "https://github.com/abinivas-17/apex-rag"
Repository = "https://github.com/abinivas-17/apex-rag"
Issues = "https://github.com/abinivas-17/apex-rag/issues"
Documentation = "https://github.com/abinivas-17/apex-rag#readme"

[tool.hatch.build.targets.wheel]
packages = ["apex_rag"]

[project.scripts]
# CLI entry point:  apex-rag serve --port 8000
apex-rag = "apex_rag.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apex_rag"]
omit = ["tests/*", "examples/*"]


