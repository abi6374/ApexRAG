site_name: ApexRAG
site_description: Production-grade, local-first Agentic RAG library using structural document navigation.
site_url: https://abi6374.github.io/apexrag
repo_url: https://github.com/abi6374/apexrag
repo_name: abi6374/apexrag
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/lightbulb
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.expand
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    logo: material/robot
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            docstring_style: google
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/abi6374/apexrag
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/apex-rag/

copyright: |
  &copy; 2025 <a href="https://github.com/abi6374">G S Abinivas</a>

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quickstart.md
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
  - Guides:
    - Ingesting Documents: guides/ingestion.md
    - Querying with Agentic Navigation: guides/querying.md
    - Hybrid Search: guides/hybrid-search.md
    - Batch Ingestion: guides/batch-ingestion.md
    - REST API: guides/rest-api.md
    - Monitoring: guides/monitoring.md
  - API Reference:
    - ApexIndex: api/apex-index.md
    - Navigation: api/navigation.md
    - Storage: api/storage.md
    - Providers: api/providers.md
    - Exceptions: api/exceptions.md
    - Search: api/search.md
  - Architecture: ARCHITECTURE.md
  - Deployment:
    - Docker: deployment/docker.md
    - Production Checklist: deployment/production-checklist.md
  - Contributing: contributing.md
  - Changelog: changelog.md
