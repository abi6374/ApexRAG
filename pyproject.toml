[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apex-rag"
version = "1.0.3"
description = "High-accuracy Structural RAG library using Abstract Syntax Trees (AST) for precise document navigation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "G S Abinivas" }
]
keywords = ["rag", "llm", "ast", "structural-retrieval", "agentic", "openai", "anthropic", "ollama"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

# ── Core Dependencies ─────────────────────────────────────────────────────
dependencies = [
    # Document parsing & structure
    "markitdown>=0.0.1a2",
    # ORM & Storage
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # Primary LLM Support (Default)
    "openai>=1.30.0",
    # Utilities
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typing-extensions>=4.10.0",
    "networkx>=3.0",
    # OpenTelemetry Tracing
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    # Langchain integration
    "langchain-core>=0.1.0",
]

# ── Optional Extras ───────────────────────────────────────────────────────
[project.optional-dependencies]
# Additional Cloud Providers
anthropic = ["anthropic>=0.28.0"]
groq = ["groq>=0.9.0"]
ollama = ["ollama>=0.2.0"]

# Web dashboard & Demo
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "gradio>=4.31.0",
]

# Advanced Data & Scaling
postgres = ["asyncpg>=0.29.0", "psycopg2-binary>=2.9.9"]
docling = ["docling>=1.16.0"]
telemetry = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0"
]

# Research & Evaluation
benchmarks = [
    "ragas>=0.1.7",
    "llama-index-core>=0.10.0",
    "datasets>=2.19.0",
    "pandas>=2.2.0",
]

# Development
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "tox>=4.0.0",
]

# Install all features: pip install apex-rag[all]
all = [
    "apex-rag[anthropic,groq,ollama,web,postgres,docling,telemetry,benchmarks,dev]",
]

[project.urls]
Homepage = "https://github.com/abinivas-17/apex-rag"
Repository = "https://github.com/abinivas-17/apex-rag"
Issues = "https://github.com/abinivas-17/apex-rag/issues"

[tool.hatch.build.targets.wheel]
packages = ["apex_rag"]

[project.scripts]
apex-rag = "apex_rag.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]
